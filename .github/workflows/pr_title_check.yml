name: Manual PR Title Check

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "要处理的 PR 编号"
        required: true
        type: number

permissions:
  pull-requests: write

jobs:
  pr-title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title for required prefix and comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = Number(context.payload.inputs.pr_number);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed('PR number must be a positive integer');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: prNumber });
            const title = pr.title;
            if (/^(feat|docs|fix|style|refactor|chore)\(.+?\)!?: /i.test(title)) return;
            const comment = `⚠️ PR 标题需以 \`feat(): \`, \`docs(): \`, \`fix(): \`, \`style(): \`, \`refactor(): \`, \`chore(): \` 其中之一开头，例如：\`feat(component): 新增功能\`。
            ⚠️ The PR title must start with \`feat(): \`, \`docs(): \`, \`fix(): \`, \`style(): \`, or \`refactor(): \`, \`chore(): \`. For example: \`feat(component): add new feature\`.

            如果跨多个组件，请使用主要组件作为前缀，并在标题中枚举、描述中说明。
            If it spans multiple components, use the main component as the prefix and enumerate in the title, describe in the body.

            如果是破坏性变更，请在类型后添加 \`!\`，例如 \`feat(component)!: 破坏性变更\`。
            For breaking changes, add \`!\` after the type, e.g., \`feat(component)!: breaking change\`.

            `;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: prNumber,
              body: comment
            });
