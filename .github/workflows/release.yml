name: Custom Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "后端版本号；留空获取官方最新正式版号，编译当前分支"
        required: false
        type: string
      frontend_mode:
        description: "源码编译保留前端新功能，或下载已发布的前端"
        type: choice
        options: [source, release]
        default: source
      frontend_repo:
        description: "前端仓库 owner/repo"
        type: string
        default: "12189108/OpenList-Frontend"
      frontend_ref:
        description: "源码模式：前端分支、标签或 SHA"
        type: string
        default: "main"
      frontend_version:
        description: "前端版本；留空：源码模式取官方最新正式版号，Release 模式取所选仓库最新正式版"
        required: false
        type: string
      publish:
        description: "同时发布 GitHub Release（版本标签必须尚不存在）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout frontend source
        if: inputs.frontend_mode == 'source'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.frontend_repo }}
          ref: ${{ inputs.frontend_ref }}
          path: .build/frontend
          persist-credentials: false

      - name: Setup Node
        if: inputs.frontend_mode == 'source'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup frontend pnpm
        if: inputs.frontend_mode == 'source'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: .build/frontend/package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          curl -fL https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-0.11.0" >> "$GITHUB_PATH"
          chmod +x wrapper/zcc-arm64 wrapper/zcxx-arm64

      - name: Compile backend with selected frontend
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          FRONTEND_MODE: ${{ inputs.frontend_mode }}
          FRONTEND_REPO: ${{ inputs.frontend_repo }}
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
          FRONTEND_SOURCE_DIR: ${{ github.workspace }}/.build/frontend
        run: bash scripts/build-custom.sh

      - name: Upload binaries and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: openlist-${{ steps.build.outputs.version }}
          path: build/*
          if-no-files-found: error

      - name: Publish custom release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "标签 $VERSION 已存在，请指定新的自定义版本号。" >&2
            exit 1
          fi
          args=()
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Release $VERSION" \
            --generate-notes "${args[@]}" build/*
