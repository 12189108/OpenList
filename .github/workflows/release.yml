name: Custom Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Backend release tag (e.g. v4.2.6-custom.1)"
        required: true
        type: string
      frontend_version:
        description: "Published tag from 12189108/OpenList-Frontend to embed"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release versions
        env:
          VERSION: ${{ inputs.version }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$VERSION" =~ $pattern && "$FRONTEND_VERSION" =~ $pattern ]]

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Embed the selected custom frontend
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          mkdir -p frontend-assets public/dist
          gh release download "$FRONTEND_VERSION" --repo 12189108/OpenList-Frontend \
            --pattern "openlist-frontend-dist-$FRONTEND_VERSION.tar.gz" --dir frontend-assets
          tar -xzf "frontend-assets/openlist-frontend-dist-$FRONTEND_VERSION.tar.gz" -C public/dist
          test -f public/dist/index.html
          test "$(cat public/dist/VERSION)" = "$FRONTEND_VERSION"

      - name: Test upload and request handling
        run: go test ./internal/upload ./internal/multipart ./server/handles ./server/middlewares

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          curl -fL https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          chmod +x wrapper/zcc-arm64 wrapper/zcxx-arm64

      - name: Build four platform binaries
        env:
          VERSION: ${{ inputs.version }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          export PATH="$PWD/zig-linux-x86_64-0.11.0:$PATH"
          export CGO_ENABLED=1
          mkdir -p build
          BUILT_AT="$(date +'%F %T %z')"
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$BUILT_AT' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$GIT_COMMIT' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$VERSION' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=$FRONTEND_VERSION'"
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            export GOOS=${target%/*}
            export GOARCH=${target#*/}
            case "$target" in
              linux/amd64) export CC=gcc CXX=g++ ;;
              linux/arm64) export CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ ;;
              windows/amd64) export CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ ;;
              windows/arm64) export CC="$PWD/wrapper/zcc-arm64" CXX="$PWD/wrapper/zcxx-arm64" ;;
            esac
            output="build/openlist-$GOOS-$GOARCH"
            if [[ "$GOOS" == windows ]]; then output="$output.exe"; fi
            go build -o "$output" -ldflags="$LDFLAGS" -tags=jsoniter .
          done

      - name: Publish custom release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "Release $VERSION" --generate-notes build/*
